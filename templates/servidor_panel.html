<!DOCTYPE html>
<html>
<head>
    <title>Control Cabina PRO</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #020617;
            color: #e2e8f0;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .contenedor {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 25px;
        }

        .pc {
            background: #0f172a;
            border-radius: 20px;
            padding: 20px;
        }

        .tiempo {
            font-size: 32px;
            text-align: center;
        }

        .precio {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: none;
            margin-top: 8px;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-asignar { background: #22c55e; }
        .btn-cobrar { background: #ef4444; color: white; }
    </style>
</head>

<body>

<h1>🖥️ Control Cabina PRO</h1>

<div class="contenedor">
{% for pc, data in pcs.items() %}
<div class="pc">

    <h2>{{ pc }}</h2>

    <div class="tiempo" id="tiempo-{{ pc }}">
        {{ data.tiempo_str }}
    </div>

    <div class="precio">
        💰 ${{ data.costo }}
    </div>

    <!-- ASIGNAR -->
    <form action="/asignar" method="post" onsubmit="return procesar(this)">
        <input type="hidden" name="nombre" value="{{ pc }}">
        <input type="text" name="entrada" placeholder="Ej: 2 o .30 o 1.30" required>
        <button class="btn-asignar">Asignar Tiempo</button>
    </form>

    <!-- NOTAS -->
    <form action="/nota" method="post">
        <input type="hidden" name="nombre" value="{{ pc }}">
        <textarea name="nota">{{ data.nota }}</textarea>
    </form>

    <!-- COBRAR -->
    <form action="/cobrar" method="post" onsubmit="return confirmarCobro('{{ pc }}')">
        <input type="hidden" name="nombre" value="{{ pc }}">
        <button class="btn-cobrar">💰 Cobrar y liberar</button>
    </form>

</div>
{% endfor %}
</div>

<script>
function convertir(valor){
    valor = valor.trim();

    if(valor.includes(".")){
        let [h,m] = valor.split(".");
        return (parseInt(h||0)*60)+(parseInt(m||0));
    }
    return parseInt(valor||0)*60;
}

function procesar(form){
    let input = form.querySelector("input[name='entrada']");
    let minutos = convertir(input.value);

    let hidden = document.createElement("input");
    hidden.type = "hidden";
    hidden.name = "tiempo";
    hidden.value = minutos;

    form.appendChild(hidden);
    return true;
}

function confirmarCobro(pc){
    return confirm("¿Cobrar y liberar " + pc + "?");
}

// 🔥 ACTUALIZACIÓN EN TIEMPO REAL
setInterval(async () => {
    let res = await fetch("/datos");
    let data = await res.json();

    for (let pc in data){
        let t = data[pc].tiempo;

        let h = Math.floor(t/3600);
        let m = Math.floor((t%3600)/60);
        let s = t%60;

        let txt =
            String(h).padStart(2,'0') + ":" +
            String(m).padStart(2,'0') + ":" +
            String(s).padStart(2,'0');

        let el = document.getElementById("tiempo-"+pc);
        if(el) el.textContent = txt;
    }
}, 1000);

// GUARDAR NOTAS AUTOMÁTICO
document.querySelectorAll("textarea").forEach(t=>{
    t.addEventListener("keyup", ()=>{
        let form = t.closest("form");
        fetch("/nota", {
            method: "POST",
            body: new FormData(form)
        });
    });
});
</script>

</body>
</html>

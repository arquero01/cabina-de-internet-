<!DOCTYPE html>
<html>
<head>
    <title>Control Cabina</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 32px;
        }

        .contenedor {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 25px;
        }

        .pc {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pc h2 {
            margin: 0;
            text-align: center;
        }

        .tiempo {
            font-size: 32px;
            text-align: center;
            font-weight: bold;
        }

        .activo { color: #22c55e; }
        .medio { color: #f59e0b; }
        .agotado { color: #ef4444; }

        .seccion {
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: none;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: black;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #16a34a;
        }

        .botones-rapidos {
            display: flex;
            gap: 5px;
        }

        .botones-rapidos button {
            flex: 1;
            background: #38bdf8;
        }
    </style>
</head>
<body>

<h1>🖥️ Panel de Control Cabina</h1>

<div class="contenedor">
    {% for pc, data in pcs.items() %}
    <div class="pc">

        <h2>{{ pc }}</h2>

        <!-- TIEMPO -->
        <div class="tiempo 
            {% if data.tiempo > 1800 %}
                activo
            {% elif data.tiempo > 600 %}
                medio
            {% else %}
                agotado
            {% endif %}
        " id="tiempo-{{ pc }}">
            {{ data.tiempo_str }}
        </div>
        <div id="acciones-{{ pc }}"></div>

        <!-- ASIGNAR TIEMPO -->
        <div class="seccion">
            <form action="/asignar" method="post">
                <input type="hidden" name="nombre" value="{{ pc }}">
                <input type="text" name="tiempo_input" class="input-tiempo" placeholder="Ej: 2 o .30 o 1.30" required>
                <button>Asignar Tiempo</button>
            </form>
        </div>

        <!-- CONSUMO -->
        <div class="seccion">
            <form action="/nota" method="post">
                <input type="hidden" name="nombre" value="{{ pc }}">
                <textarea name="nota" rows="4" placeholder="Escribe comsumo... ">{{ data.nota }}</textarea>
            </form>
        </div>

    </div>
    {% endfor %}
</div>

<script>
let alertados = {};

async function actualizar() {
    try {
        const res = await fetch("/datos");
        const data = await res.json();

        for (let pc in data) {

            let tiempo = data[pc].tiempo; 

            let h = Math.floor(tiempo / 3600);
            let m = Math.floor((tiempo % 3600) / 60);
            let s = tiempo % 60;

            let texto =
                String(h).padStart(2, '0') + ":" +
                String(m).padStart(2, '0') + ":" +
                String(s).padStart(2, '0');

            let el = document.getElementById("tiempo-" + pc);
            if (el) el.textContent = texto;

            // 🚨 ALERTA CUANDO TERMINA
            if (tiempo === 0 && !alertados[pc]) {
                alertados[pc] = true;

                let cont = document.getElementById("acciones-" + pc);
                if (cont) {
                    cont.innerHTML = `
                        <div style="color:red;">⏰ Tiempo terminado</div>
                        <button onclick="agregarTiempo('${pc}', 30)">+30 min</button>
                        <button onclick="agregarTiempo('${pc}', 60)">+60 min</button>
                    `;
                }
            }
        }
    } catch (error) {
        console.log("ERROR:", error);
    }
}

function agregarTiempo(pc, minutos) {
    fetch("/asignar", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: `nombre=${pc}&tiempo=${minutos}`
    });
}

// 🔥 IMPORTANTE
window.onload = () => {
    setInterval(actualizar, 1000);
};
</script>
<script>
    function convertirTiempo(valor){
        valor = valor.trim();
        if (valor.includes(".")){
            let partes = valor.split(".");
            let horas = parseInt(partes[0]) || 0;
            let minutos = parseInt(partes[1]) || 0;
            return (horas * 60) + minutos;
        }else {
            return parseInt(valor)*60;
        }
    }
</script>
<script>
document.querySelectorAll(".input-tiempo").forEach(input =>{
    input.addEventListener("keydown", function(e){
        if (e.key === "Enter"){
            e.preventDefault();

            let valor = this.value;
            let minutos = convertirTiempo(valor);

            let form = this.closest("form");

            let hidden = document.createElement("input");
            hidden.type = "hidden";
            hidden.name = "tiempo";
            hidden.value = minutos;

            form.appendChild(hidden);
            form.submit();
        }
    });
});
</script>
<script>
    document.querySelectorAll("textarea").forEach(area =>{
        area.addEventListener("keyup", function(){
            let form = this.closest("form");
            let data = new FormData(form);
            fetch("/nota", {
                method: "post",
                body: data
            });
        });
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CyberControl Pro</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", sans-serif;
    background: #020617;
    color: #e2e8f0;
}

/* HEADER */
.header {
    background: #020617;
    border-bottom: 1px solid #1e293b;
    padding: 15px 25px;
    font-size: 24px;
    font-weight: bold;
    color: #38bdf8;
}

/* GRID */
.contenedor {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* TARJETA */
.pc {
    background: #0f172a;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 15px;
    transition: 0.2s;
}

.pc:hover {
    transform: scale(1.02);
}

/* NOMBRE */
.pc h2 {
    text-align: center;
    color: #38bdf8;
}

/* TIEMPO */
.tiempo {
    font-size: 36px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 2px;
}

/* ESTADOS */
.activo { color: #22c55e; }
.medio { color: #f59e0b; }
.agotado { color: #ef4444; }

/* BLOQUES */
.bloque {
    background: #020617;
    padding: 10px;
    border-radius: 10px;
}

/* INPUTS */
input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #020617;
    color: white;
    border: 1px solid #1e293b;
}

/* BOTONES */
button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.btn-asignar {
    background: #22c55e;
}

.btn-reset {
    background: #ef4444;
    color: white;
}

/* COSTO */
.costo {
    text-align: center;
    font-size: 18px;
    color: #facc15;
}
</style>
</head>

<body>

<div class="header">🖥️ CyberControl Pro</div>

<div class="contenedor">
{% for pc, data in pcs.items() %}
<div class="pc">

    <h2>{{ pc }}</h2>

    <!-- TIEMPO -->
    <div class="tiempo 
        {% if data.tiempo > 1800 %}
            activo
        {% elif data.tiempo > 300 %}
            medio
        {% else %}
            agotado
        {% endif %}
    " id="tiempo-{{ pc }}">
        {{ data.tiempo_str }}
    </div>

    <!-- COSTO -->
    <div class="costo">
        💰 ${{ data.costo }}
    </div>

    <!-- ASIGNAR -->
    <div class="bloque">
        <form onsubmit="return enviarTiempo(this)">
            <input type="hidden" name="nombre" value="{{ pc }}">
            <input type="text" name="tiempo_input" placeholder="Ej: 2 o .30 o 1.30" required>
            <button class="btn-asignar">Asignar Tiempo</button>
        </form>
    </div>

    <!-- CONSUMO -->
    <div class="bloque">
        <form>
            <input type="hidden" name="nombre" value="{{ pc }}">
            <textarea name="nota" rows="3" placeholder="Consumo...">{{ data.nota }}</textarea>
        </form>
    </div>

    <!-- RESET -->
    <form action="/reset" method="post">
        <input type="hidden" name="nombre" value="{{ pc }}">
        <button class="btn-reset">Cobrar y Resetear</button>
    </form>

</div>
{% endfor %}
</div>

<script>
// 🔄 TIEMPO EN VIVO
async function actualizar() {
    const res = await fetch("/datos");
    const data = await res.json();

    for (let pc in data) {
        let tiempo = data[pc].tiempo;

        let h = Math.floor(tiempo / 3600);
        let m = Math.floor((tiempo % 3600) / 60);
        let s = tiempo % 60;

        let texto =
            String(h).padStart(2,'0') + ":" +
            String(m).padStart(2,'0') + ":" +
            String(s).padStart(2,'0');

        let el = document.getElementById("tiempo-" + pc);
        if (el) el.textContent = texto;
    }
}
setInterval(actualizar, 1000);

// 🔥 CONVERTIR TIEMPO
function convertirTiempo(valor){
    valor = valor.trim();

    if (valor.includes(".")){
        let partes = valor.split(".");
        let h = parseInt(partes[0]) || 0;
        let m = parseInt(partes[1]) || 0;
        return (h * 60) + m;
    } else {
        return parseInt(valor) * 60;
    }
}

// 🔥 ENVIAR FORMULARIO
function enviarTiempo(form){
    let input = form.querySelector("input[name='tiempo_input']");
    let minutos = convertirTiempo(input.value);

    let hidden = document.createElement("input");
    hidden.type = "hidden";
    hidden.name = "tiempo";
    hidden.value = minutos;

    form.appendChild(hidden);
    form.action = "/asignar";
    form.method = "post";

    return true;
}

// 🔥 GUARDAR CONSUMO AUTOMÁTICO
document.querySelectorAll("textarea").forEach(area =>{
    area.addEventListener("keyup", function(){
        let form = this.closest("form");
        let data = new FormData(form);

        fetch("/nota", {
            method: "post",
            body: data
        });
    });
});
</script>

</body>
</html>
